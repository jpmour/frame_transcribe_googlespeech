name: Build APK

on:
  push:
    branches: ['**']   # main and any feature/spike branch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Flutter 3.22.3 (Dart 3.4.4): pubspec.lock needs Dart >= 3.4.4, and it is the 3.22 line
      # that the repo's Gradle/AGP/Kotlin versions were set up with
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      # Secrets are read through env vars only. They are never echoed, and GitHub masks them in logs.
      # Fork PRs get no secrets, so they fall back to the debug key.
      - name: Set up release signing (if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets found. This build uses the debug key and will NOT update over release-signed builds."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          {
            echo "storeFile=$KEYSTORE_PATH"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Release signing configured."

      - run: flutter pub get

      # Build number grows with every run so each APK can update over the previous one
      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: frame-transcribe-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
