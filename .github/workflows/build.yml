name: Build APK

on:
  push:
    branches: ['**']   # main and any feature/spike branch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Flutter 3.22.3 (Dart 3.4.4): pubspec.lock needs Dart >= 3.4.4, and it is the 3.22 line
      # that the repo's Gradle/AGP/Kotlin versions were set up with
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      # Secrets are read through env vars only. They are never echoed, and GitHub masks them in logs.
      # Fork PRs get no secrets, so they fall back to the debug key.
      - name: Set up release signing (if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets found. This build uses the debug key and will NOT update over release-signed builds."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          {
            echo "storeFile=$KEYSTORE_PATH"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Release signing configured."

      # The app loads assets/frame_app.min.lua, so regenerate it from frame_app.lua and fail
      # the build if the committed copy was stale (keeps the two files from drifting apart)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate and check frame_app.min.lua
        run: |
          npm ci --prefix tool
          node tool/minify_lua.js
          git diff --exit-code -- assets/frame_app.min.lua || { echo "::error::frame_app.min.lua was out of date. Run 'node tool/minify_lua.js' and commit."; exit 1; }

      - run: flutter pub get

      # Only real errors fail the build; warnings and hints are just printed
      - name: Analyze
        shell: bash
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$RUNNER_TEMP/analyze.log"

      # Build number grows with every run so each APK can update over the previous one
      - name: Build release APK
        shell: bash
        run: flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Publish only the public certificate fingerprint, so consecutive builds can be compared:
      # the same fingerprint means a new APK installs over the old one with settings kept.
      - name: Report signing certificate
        shell: bash
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          SHA=$(echo "$CERTS" | grep -m1 'SHA-256 digest' | sed 's/.*: //')
          if echo "$CERTS" | grep -q 'Android Debug'; then KIND="DEBUG key (no release secrets were available)"; else KIND="release key"; fi
          echo "::notice title=APK signed with::$KIND, SHA-256 $SHA"

      # Copy the tail of a failed step's output into an annotation, so the cause is visible
      # without downloading logs (no secrets are printed by these commands)
      - name: Summarize failure
        if: failure()
        shell: bash
        run: |
          for f in analyze build; do
            if [ -f "$RUNNER_TEMP/$f.log" ]; then
              msg=$(tail -c 3000 "$RUNNER_TEMP/$f.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=$f output::$msg"
            fi
          done

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: frame-transcribe-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
